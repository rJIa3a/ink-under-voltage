<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чернила под током</title>
<link rel="stylesheet" href="style.css">
<script src="game.js?v=19" defer></script>
</head>
<body>
<main>
<header><div class="edition">НОЧНАЯ ПЕЧАТЬ <b>№ 01</b></div><button id="sound" type="button" aria-pressed="true">Звук включён</button></header>
<section class="sheet" aria-label="Игровая страница комикса">
<div class="stage">
<canvas id="game" width="960" height="480" aria-label="Чернила под током"></canvas>
<div class="hud" hidden><div class="health"><span>ВЕРА</span><progress id="health" max="100" value="100" aria-label="Здоровье Веры"></progress></div><div id="panel" class="caption"></div></div>
<div id="screen" class="overlay">
<div class="title-card">
<p id="kicker">ЭКШЕН-КОМИКС</p>
<h1 id="title">Чернила<br>под током</h1>
<p id="message">Ночной тираж ожил. Помоги Вере пробиться на крышу типографии и отключить реле.</p>
<button id="action" type="button">Начать выпуск <span>↵</span></button>
</div>
</div>
</div>
</section>
<footer><span><kbd>←</kbd> <kbd>→</kbd> движение</span><span><kbd>Пробел</kbd> прыжок</span><span><kbd>X</kbd> серия ударов</span><span><kbd>Z</kbd> подсечка / удар в прыжке</span><span><kbd>C</kbd> блок</span><span><kbd>P</kbd> пауза</span></footer>
<div class="touch" aria-label="Сенсорное управление"><button data-key="ArrowLeft" aria-label="Влево">←</button><button data-key="ArrowRight" aria-label="Вправо">→</button><button data-key="KeyC">Блок</button><button data-key="Space">Прыжок</button><button data-key="KeyX">Удар</button><button data-key="KeyZ">Нога</button></div>
</main>
</body>
</html>
